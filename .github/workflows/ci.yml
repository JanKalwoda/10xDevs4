name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm test
      - run: node --test scripts/eslint-rules/timer-ui-contract.test.mjs scripts/eslint-rules/account-entry-ui-contract.test.mjs
      - run: npx astro check
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - uses: supabase/setup-cli@v2
      - run: npm ci
      - name: Start local Supabase
        run: |
          if ! supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor; then
            echo "Primary image registry unavailable; retrying with Docker Hub"
            sleep 15
            SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          fi
          supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|ANON_KEY)=' >> "$GITHUB_ENV"
      - name: Run database tests (pgTAP)
        run: |
          if ! supabase test db; then
            echo "Database tests failed; retrying once with Docker Hub in case the pg_prove image pull failed"
            sleep 15
            SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io supabase test db
          fi
      - name: Configure secrets for build and preview
        run: |
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "${PUBLISHABLE_KEY:-$ANON_KEY}" > .env
          cp .env .dev.vars
      - run: npm run build
      - name: Run local Mailpit E2E against production preview
        run: |
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          SMOKE_MODE=local BASE_URL=http://localhost:4321 MAILPIT_URL=http://localhost:55324 npm run smoke
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4321/dev/timer-ui)" = 404
      - if: always()
        run: supabase stop --no-backup

  deploy:
    if: github.event_name == 'push' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: [ci, smoke]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke public routes only (does not verify email delivery or auth exchange)
        run: npm run smoke
        env:
          SMOKE_MODE: remote
          BASE_URL: ${{ vars.PRODUCTION_URL }}
      - name: Record deployed version
        run: npx wrangler versions list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
