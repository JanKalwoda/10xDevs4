name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm test
      - run: node --test scripts/eslint-rules/timer-ui-contract.test.mjs scripts/eslint-rules/account-entry-ui-contract.test.mjs scripts/agent-hooks.test.mjs
      - run: npx astro check
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - uses: supabase/setup-cli@v2
      - run: npm ci
      - name: Start local Supabase
        run: |
          if ! supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor; then
            echo "Primary image registry unavailable; retrying with Docker Hub"
            sleep 15
            SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          fi
          supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|ANON_KEY)=' >> "$GITHUB_ENV"
      - name: Run database tests (pgTAP)
        run: |
          if ! supabase test db; then
            echo "Database tests failed; retrying once with Docker Hub in case the pg_prove image pull failed"
            sleep 15
            SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io supabase test db
          fi
      - name: Configure secrets for build and preview
        run: |
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "${PUBLISHABLE_KEY:-$ANON_KEY}" > .env
          cp .env .dev.vars
      - run: npm run build
      - name: Start production preview
        id: preview
        run: |
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && exit 0; sleep 1; done
          echo "Preview did not start on port 4321"
          exit 1
      - name: Run local Mailpit smoke against production preview
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        run: SMOKE_MODE=local BASE_URL=http://localhost:4321 MAILPIT_URL=http://localhost:55324 npm run smoke
      - name: Run integration suite against production preview
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        run: BASE_URL=http://localhost:4321 MAILPIT_URL=http://localhost:55324 npm run test:integration
      - name: Production preview hides the dev timer UI
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4321/dev/timer-ui)" = 404
      # Astro allows one `astro preview` per project (a lock file), so the smoke preview must stop before
      # Playwright's webServer can start its own.
      - name: Stop the smoke preview
        if: ${{ !cancelled() }}
        run: |
          npx astro preview stop
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:4321/ || exit 0; sleep 1; done
          echo "Smoke preview still answers on port 4321"
          exit 1
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # Playwright's webServer builds and serves its own production preview on 4323, which supabase/config.toml
      # allows as a magic-link redirect. The setup project signs in through Mailpit with a fresh local account.
      - name: Run E2E suite (Playwright)
        if: ${{ !cancelled() }}
        run: npx playwright test
        env:
          E2E_PORT: 4323
          E2E_USERNAME: e2e@example.com
          MAILPIT_URL: http://localhost:55324
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - if: always()
        run: supabase stop --no-backup

  deploy:
    if: github.event_name == 'push' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: [ci, smoke]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke public routes only (does not verify email delivery or auth exchange)
        run: npm run smoke
        env:
          SMOKE_MODE: remote
          BASE_URL: ${{ vars.PRODUCTION_URL }}
      - name: Record deployed version
        run: npx wrangler versions list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
