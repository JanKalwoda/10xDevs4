name: Production route smoke (no email delivery or auth exchange)

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Verify public routes only (no email delivery or auth exchange)
        run: npm run smoke
        env:
          SMOKE_MODE: remote
          BASE_URL: ${{ vars.PRODUCTION_URL }}
